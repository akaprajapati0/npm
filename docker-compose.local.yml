services:
  mongo:
    image: mongo:8.0.19
    container_name: npp-local-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - npp_mongo_data:/data/db

  mysql:
    image: mysql:8.0.46
    container_name: npp-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_DATABASE: name_patient_program2026
      MYSQL_USER: npp2026_npm
      MYSQL_PASSWORD: '32423sdG4343$$(**@890365B'
    ports:
      - "3306:3306"
    volumes:
      - npp_mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: npp-local-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/npp-db
      FRONTEND_URL: http://localhost
      SOCIAL_REDIRECT_URI: http://localhost/api/auth
      CORS_ORIGINS: http://localhost,http://localhost:3000
      PUBLIC_UPLOAD_BASE_URL: http://localhost
      ACCESS_TOKEN_SECRET: local-access-secret
      REFRESH_TOKEN_SECRET: local-refresh-secret
      ADMIN_ACCESS_SECRET: local-admin-access-secret
      ADMIN_REFRESH_SECRET: local-admin-refresh-secret
      SESSION_SECRET: local-session-secret
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
        NEXT_PUBLIC_IMAGE_URL: http://localhost/uploads
    container_name: npp-local-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_IMAGE_URL: http://localhost/uploads
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/hooks:/app/hooks
      - ./frontend/lib:/app/lib
      - ./frontend/store:/app/store
      - ./frontend/types:/app/types
      - ./frontend/utils:/app/utils
      - ./frontend/public:/app/public

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: npp-local-php
    restart: unless-stopped
    depends_on:
      - mysql
    volumes:
      - ./namedpatientprogram:/var/www/namedpatientprogram
      - ./docker/php/database.local.php:/var/www/namedpatientprogram/application/config/database.php:ro

  nginx:
    image: nginx:1.24.0
    container_name: npp-local-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - php
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./namedpatientprogram:/var/www/namedpatientprogram:ro
      - ./backend/uploads:/var/www/backend/uploads:ro

volumes:
  npp_mongo_data:
  npp_mysql_data:
